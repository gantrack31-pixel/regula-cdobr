# Optional complete container deployment; no published Ollama port.
# docker compose -f compose.yaml -f compose.ollama.yaml up --build -d
# docker compose -f compose.yaml -f compose.ollama.yaml exec ollama ollama pull qwen3:8b
# docker compose -f compose.yaml -f compose.ollama.yaml exec ollama ollama pull qwen3-embedding:0.6b
services:
  app:
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - ollama
  ollama:
    image: ollama/ollama:latest
    volumes:
      - regula-models:/root/.ollama
    restart: unless-stopped
    # CPU works by default. Enable NVIDIA Container Toolkit and gpus: all for GPU.
volumes:
  regula-models:
